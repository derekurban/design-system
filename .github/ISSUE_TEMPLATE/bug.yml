name: Bug
description: Something renders, behaves or reads wrong.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Component, token or guideline
      placeholder: Button, --accent-text, guidelines/motion
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations: { required: true }
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, Both]
  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen
    validations: { required: true }
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or a link to the project
