name: Token or foundation change
description: Color, type, spacing, radius, depth, motion, logo or writing rules.
labels: [foundation]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Color, Typography, Spacing, Radius, Depth, Motion, Logo, Writing, Other]
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Current value, proposed value, both themes if it's a color.
    validations: { required: true }
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Which principle it serves, or which problem it fixes.
    validations: { required: true }
  - type: dropdown
    id: breaking
    attributes:
      label: Does this rename or remove anything consumers use?
      options: ["No", "Yes", Not sure]
