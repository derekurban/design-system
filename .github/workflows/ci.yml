name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    # Windows too: npm runs install scripts through cmd.exe there, so POSIX-only commands break installs from GitHub.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
