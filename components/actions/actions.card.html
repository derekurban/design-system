<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Button, IconButton, Icon, IconSwap } = NS;
function CopyButton() {
  const [on, setOn] = React.useState(false);
  const t = React.useRef(null);
  const go = () => { setOn(true); clearTimeout(t.current); t.current = setTimeout(() => setOn(false), 1400); };
  return <Button onClick={go} iconStart={<IconSwap active={on} from={<Icon name="link" />} to={<Icon name="check" />} />}>{on ? 'Copied' : 'Copy link'}</Button>;
}
function ActionSet() {
  return (<>
    <div className="row"><span className="cap">Variants</span>
      <Button variant="primary">Save draft</Button>
      <Button>Preview</Button>
      <Button variant="ghost">Cancel</Button>
      <Button variant="danger">Delete</Button>
    </div>
    <div className="row"><span className="cap">Sizes</span>
      <Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" iconEnd={<Icon name="arrow-right" size={18} />}>Read the case study</Button>
    </div>
    <div className="row"><span className="cap">States</span>
      <Button disabled>Disabled</Button>
      <CopyButton />
      <IconButton label="Search"><Icon name="search" /></IconButton>
      <IconButton label="Filter" variant="secondary"><Icon name="sliders-horizontal" /></IconButton>
      <IconButton label="Pin" selected><Icon name="pin" /></IconButton>
      <IconButton label="More" size="sm"><Icon name="ellipsis" /></IconButton>
    </div>
  </>);
}
function App() {
  return (<>
    <div className="pane"><ActionSet /></div>
    <div className="pane" data-theme="dark"><div className="row"><span className="cap">Dark</span>
      <Button variant="primary">Save draft</Button><Button>Preview</Button><Button variant="ghost">Cancel</Button>
      <IconButton label="Pin" selected><Icon name="pin" /></IconButton><IconButton label="Search"><Icon name="search" /></IconButton>
    </div></div>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
