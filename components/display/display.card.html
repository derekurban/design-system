<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Tag, Avatar } = NS;
function App() {
  const [sel, setSel] = React.useState(['Psychology']);
  const t = v => setSel(s => s.includes(v) ? s.filter(x => x !== v) : [...s, v]);
  return (
    <div className="pane">
      <div className="row"><span className="cap">Tags</span>
        {['Behavior', 'Psychology', 'Systems', 'Tools'].map(v => <Tag key={v} selected={sel.includes(v)} onClick={() => t(v)}>{v}</Tag>)}
        <Tag size="sm">Draft</Tag><Tag size="sm" onRemove={() => {}}>Removable</Tag>
      </div>
      <div className="row"><span className="cap">Avatars</span>
        <Avatar name="Derek Urban" size={24} /><Avatar name="Derek Urban" size={32} /><Avatar name="Ana Ruiz" size={40} /><Avatar name="Sam Okafor" size={48} /><Avatar name="Lee Park" size={64} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
