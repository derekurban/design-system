<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Toast, Tooltip, Button, IconButton, Icon } = NS;
function App() {
  const [toasts, setToasts] = React.useState([]);
  const n = React.useRef(0);
  const add = () => { const id = ++n.current; setToasts(ts => [...ts.slice(-1), id]); };
  const remove = id => setToasts(ts => ts.filter(x => x !== id));
  return (
    <div className="pane" style={{ flexDirection: 'row', gap: 24, alignItems: 'flex-start' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <Toast animateIn={false} tone="success" title="Draft saved" description="Synced a moment ago." />
        <Toast animateIn={false} title="Note archived" action={<Button variant="ghost" size="sm">Undo</Button>} />
        <Toast animateIn={false} tone="danger" title="That didn't save" description="Check your connection and try again." />
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, paddingTop: 40 }}>
        <div className="row" style={{ gap: 4 }}>
          <Tooltip content="Copy link"><IconButton label="Copy link"><Icon name="link" /></IconButton></Tooltip>
          <Tooltip content="Pin to top"><IconButton label="Pin"><Icon name="pin" /></IconButton></Tooltip>
          <Tooltip content="Share" side="bottom"><IconButton label="Share"><Icon name="share" /></IconButton></Tooltip>
        </div>
        <span className="du-caption" style={{ color: 'var(--ink-tertiary)' }}>Hover for tooltips; neighbors open instantly</span>
        <div className="row" style={{ marginTop: 12 }}><Button size="sm" onClick={add}>Show toast</Button></div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: 260 }}>{toasts.map(id => <Toast key={id} tone="success" title="Pattern saved" onDismiss={() => remove(id)} style={{ width: 260 }} />)}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
