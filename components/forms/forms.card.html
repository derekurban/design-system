<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.stack{display:flex;flex-direction:column;gap:12px}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Input, Select, Checkbox, Radio, Switch, SegmentedControl, Icon } = NS;
function App() {
  const [vis, setVis] = React.useState('Shared with link');
  const [range, setRange] = React.useState('Month');
  return (
    <div className="pane">
      <div className="grid">
        <Input label="Title" placeholder="Untitled note" hint="Shown at the top of the note." />
        <Input label="Email" defaultValue="derek@" error="Add the rest of the address so replies reach you." />
        <Input size="sm" iconStart={<Icon name="search" />} placeholder="Search notes" suffix="⌘K" />
        <Select size="sm" defaultValue="recent" options={[{ value: 'recent', label: 'Most recent' }, { value: 'revisited', label: 'Most revisited' }, { value: 'az', label: 'Alphabetical' }]} />
        <div className="stack">
          <Checkbox label="Weekly summary" description="A short email on Sundays." defaultChecked />
          <Checkbox label="Include archived notes" />
          <Switch label="Show strays" defaultChecked />
        </div>
        <div className="stack">
          {['Private', 'Shared with link', 'Public'].map(v => <Radio key={v} name="vis" value={v} label={v} checked={vis === v} onChange={setVis} />)}
        </div>
      </div>
      <div className="row">
        <SegmentedControl options={['Week', 'Month', 'Year']} value={range} onChange={setRange} label="Range" />
        <SegmentedControl size="sm" options={[{ value: 'list', label: 'List', icon: <Icon name="list" size={14} /> }, { value: 'map', label: 'Map', icon: <Icon name="waypoints" size={14} /> }]} value="list" />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
