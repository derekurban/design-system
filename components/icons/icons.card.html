<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;color:var(--ink-secondary);font:400 13px/18px var(--font-body)}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Icon, IconSwap, IconButton } = NS;
function CopyDemo() {
  const [on, setOn] = React.useState(false);
  const t = React.useRef(null);
  const go = () => { setOn(true); clearTimeout(t.current); t.current = setTimeout(() => setOn(false), 1400); };
  return <IconButton label={on ? 'Copied' : 'Copy link'} variant="secondary" onClick={go}><IconSwap active={on} from={<Icon name="copy" />} to={<Icon name="check" />} /></IconButton>;
}
const names = ['search', 'plus', 'pencil', 'copy', 'link', 'pin', 'arrow-right', 'check', 'x', 'ellipsis', 'settings', 'folder', 'sliders-horizontal', 'share', 'trash-2', 'waypoints'];
function App() {
  return (
    <div className="pane">
      <div className="row" style={{ gap: 20, color: 'var(--ink)' }}>{names.map(n => <Icon key={n} name={n} size={20} />)}</div>
      <div className="row" style={{ gap: 24, color: 'var(--ink)' }}>
        <Icon name="sparkle" size={16} /><Icon name="sparkle" size={20} /><Icon name="sparkle" size={24} />
        <span className="du-caption" style={{ color: 'var(--ink-tertiary)' }}>16 · 20 · 24 px, stroke 1.5, inherits currentColor</span>
      </div>
      <div className="row" style={{ gap: 12 }}>
        <CopyDemo />
        <span className="du-caption" style={{ color: 'var(--ink-tertiary)' }}>IconSwap: click to copy. Opacity, scale 0.25 → 1, blur 4px → 0</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
