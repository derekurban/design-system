<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Tabs, Menu, Icon, IconButton, Button } = NS;
function App() {
  const [tab, setTab] = React.useState('notes');
  return (
    <div className="pane" style={{ gap: 24 }}>
      <Tabs value={tab} onChange={setTab} items={[{ value: 'notes', label: 'Notes', count: 128 }, { value: 'patterns', label: 'Patterns', count: 14 }, { value: 'archive', label: 'Archive' }]} />
      <div className="row" style={{ alignItems: 'flex-start', gap: 24 }}>
        <Menu width={220} items={[
          { label: 'Rename', icon: <Icon name="pencil" /> },
          { label: 'Duplicate', icon: <Icon name="copy" />, shortcut: '⌘D' },
          { label: 'Move to', icon: <Icon name="folder" /> },
          { type: 'divider' },
          { label: 'Delete', icon: <Icon name="trash-2" />, danger: true },
        ]} />
        <Menu width={200} items={[
          { type: 'label', label: 'Sort by' },
          { label: 'Most recent', selected: true },
          { label: 'Most revisited' },
          { label: 'Alphabetical' },
        ]} />
        <Menu trigger={<Button size="sm" iconEnd={<Icon name="chevron-down" />}>Open menu</Button>} items={[{ label: 'Export as Markdown' }, { label: 'Export as PDF' }]} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
