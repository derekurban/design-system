<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg)}.pane{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cap{font:400 13px/18px var(--font-body);color:var(--ink-tertiary);width:72px;flex-shrink:0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const NS = window.DerekUrbanDesignSystem_3bae67;

const { Card, Dialog, Button } = NS;
function App() {
  const [open, setOpen] = React.useState(true);
  return (
    <div className="pane" style={{ minHeight: 372 }}>
      <div className="cards">
        <Card><div className="du-subheading">Raised</div><p className="du-small" style={{ margin: '8px 0 0', color: 'var(--ink-secondary)' }}>Surface fill with a 0.5px hairline.</p></Card>
        <Card variant="sunk"><div className="du-subheading">Sunk</div><p className="du-small" style={{ margin: '8px 0 0', color: 'var(--ink-secondary)' }}>A recessed well for grouped inputs.</p></Card>
        <Card variant="outline" interactive><div className="du-subheading">Outline</div><p className="du-small" style={{ margin: '8px 0 0', color: 'var(--ink-secondary)' }}>Transparent, hairline only.</p></Card>
      </div>
      <div className="row"><Button onClick={() => setOpen(true)}>Open dialog</Button></div>
      <Dialog open={open} onClose={() => setOpen(false)}
        title="Delete this note?"
        description="It will be removed from every pattern it appears in. This can't be undone."
        actions={<><Button variant="ghost" onClick={() => setOpen(false)}>Cancel</Button><Button variant="danger" onClick={() => setOpen(false)}>Delete note</Button></>} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
