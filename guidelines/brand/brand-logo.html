<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{height:100%;box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary)}.row{display:grid;grid-template-columns:1fr 1fr 1fr;height:100%}.row>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}.row svg{width:120px;height:120px}svg path{transform-box:view-box}
.row>div:hover .sq{stroke-dasharray:1;animation:lg-draw 900ms var(--ease-in-out) 120ms both}.row>div:hover .bl{animation:lg-in var(--duration-slow) var(--ease-settle) both}.row>div:hover .br{animation:lg-close 520ms var(--ease-settle) 900ms both}
@keyframes lg-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lg-in{from{transform:translateX(-8px);opacity:0}to{transform:none;opacity:1}}@keyframes lg-close{0%{transform:translateX(10px);stroke-opacity:.3}60%{transform:translateX(-1.5px)}100%{transform:none;stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){.row *{animation:none!important}}</style>
</head><body><div class="row">
<div data-theme="light" style="background:var(--surface)"><svg viewBox="10 10 80 80" role="img" aria-label="Logo on light"><path d="M28 18 L18 18 L18 82 L28 82" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="bl"></path><path d="M31 60 C35 26 45 74 50 46 C55 22 62 70 69 40" fill="none" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" class="sq" pathLength="1"></path><path d="M72 18 L82 18 L82 82 L72 82" fill="none" stroke="var(--accent-strong)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="br"></path></svg><div class="cap">On light</div></div>
<div data-theme="dark" style="background:var(--bg)"><svg viewBox="10 10 80 80" role="img" aria-label="Logo on dark"><path d="M28 18 L18 18 L18 82 L28 82" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="bl"></path><path d="M31 60 C35 26 45 74 50 46 C55 22 62 70 69 40" fill="none" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" class="sq" pathLength="1"></path><path d="M72 18 L82 18 L82 82 L72 82" fill="none" stroke="var(--accent-strong)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="br"></path></svg><div class="cap">On dark</div></div>
<div data-theme="light" style="background:var(--sunk);color:var(--ink-secondary)"><svg viewBox="10 10 80 80" role="img" aria-label="Logo mono"><path d="M28 18 L18 18 L18 82 L28 82" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="bl"></path><path d="M31 60 C35 26 45 74 50 46 C55 22 62 70 69 40" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" class="sq" pathLength="1"></path><path d="M72 18 L82 18 L82 82 L72 82" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="br"></path></svg><div class="cap">Mono (currentColor)</div></div>
</div></body></html>
