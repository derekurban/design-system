<!-- @dsCard group="Data" viewport="700x160" name="Proportion bar" subtitle="Gray segments with 2px gaps; the share that matters is green." -->
<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary);font-variant-numeric:tabular-nums}.lab{font:var(--font-label);color:var(--ink)}.hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}.hd>div{display:flex;flex-direction:column;gap:2px}</style>
</head><body data-theme="light"><div class="hd" style="margin-bottom:12px"><div><span class="lab">Where notes come from</span><span class="cap">Share of 318 notes this month</span></div></div>
<div id="bar" style="display:flex;gap:2px;height:12px"><div data-seg style="flex:38 1 0;border-radius:3px;background:var(--ink-tertiary)"></div><div data-seg style="flex:24 1 0;border-radius:3px;background:color-mix(in oklch, var(--ink-tertiary) 50%, var(--data-neutral))"></div><div data-seg style="flex:21 1 0;border-radius:3px;background:var(--accent-strong)"></div><div data-seg style="flex:11 1 0;border-radius:3px;background:var(--data-neutral)"></div><div data-seg style="flex:6 1 0;border-radius:3px;background:color-mix(in oklch, var(--data-neutral) 55%, var(--bg))"></div></div>
<div style="display:flex;gap:2px;margin-top:8px"><div style="flex:38 1 0;min-width:0;display:flex;flex-direction:column;gap:0"><span class="cap" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-secondary)">Reading</span><span class="cap">38%</span></div><div style="flex:24 1 0;min-width:0;display:flex;flex-direction:column;gap:0"><span class="cap" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-secondary)">Conversations</span><span class="cap">24%</span></div><div style="flex:21 1 0;min-width:0;display:flex;flex-direction:column;gap:0"><span class="cap" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent-text)">Walks</span><span class="cap">21%</span></div><div style="flex:11 1 0;min-width:0;display:flex;flex-direction:column;gap:0"><span class="cap" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-secondary)">Work</span><span class="cap">11%</span></div><div style="flex:6 1 0;min-width:0;display:flex;flex-direction:column;gap:0"><span class="cap" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-secondary)">Other</span><span class="cap">6%</span></div></div>
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('[data-seg]').forEach((s,i)=>s.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:640,delay:i*40,easing:getComputedStyle(document.body).getPropertyValue('--ease-settle').trim(),fill:'backwards',transformOrigin:'left'})||0);document.querySelectorAll('[data-seg]').forEach(s=>s.style.transformOrigin='left');</script></body></html>
