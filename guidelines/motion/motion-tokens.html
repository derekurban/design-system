<!-- @dsCard group="Motion" viewport="700x230" name="Motion" subtitle="Three durations. Ease out on entry; exits quicker. Settle is the signature." -->
<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary);font-variant-numeric:tabular-nums}.lab{font:var(--font-label);color:var(--ink)}.r{display:grid;grid-template-columns:140px 1fr 150px;align-items:center;gap:16px;padding:8px 0;box-shadow:inset 0 -0.5px 0 var(--line)}.r:last-child{box-shadow:none}.track{height:8px;border-radius:999px;background:var(--sunk);position:relative;overflow:hidden}.fill{position:absolute;inset:0 auto 0 0;background:var(--data-neutral);border-radius:999px}</style>
</head><body data-theme="light"><div class="r"><div><div class="lab">duration-fast</div><div class="cap">120ms</div></div><div class="track"><div class="fill" style="width:37.5%"></div></div><div class="cap">Hovers, presses, toggles</div></div><div class="r"><div><div class="lab">duration-base</div><div class="cap">200ms</div></div><div class="track"><div class="fill" style="width:62.5%"></div></div><div class="cap">Menus, tabs, toasts</div></div><div class="r"><div><div class="lab">duration-slow</div><div class="cap">320ms</div></div><div class="track"><div class="fill" style="width:100%"></div></div><div class="cap">Layout changes</div></div><div class="r"><div><div class="lab">ease-out</div><div class="cap">0.2, 0.8, 0.2, 1</div></div><div class="cap">cubic-bezier(0.2, 0.8, 0.2, 1)</div><div class="cap">Entrances</div></div><div class="r"><div><div class="lab">ease-settle</div><div class="cap">0.16, 1, 0.3, 1</div></div><div class="cap">cubic-bezier(0.16, 1, 0.3, 1)</div><div class="cap">The mark, first load</div></div></body></html>
