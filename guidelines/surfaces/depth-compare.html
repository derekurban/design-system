<!-- @dsCard group="Surfaces" viewport="960x660" name="Cards: hairline vs hairline + shadow" subtitle="Decided: cards use hairline + shadow (right). Left kept for reference. Hover a card." -->
<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary)}.lab{font:var(--font-label);color:var(--ink)}</style>
</head><body data-theme="light"><div id="root"></div>
<script type="text/babel">
const { Tag, Stat } = window.DerekUrbanDesignSystem_3bae67;
function DemoCard({ lift }) {
  const [h, setH] = React.useState(false);
  const shadow = lift ? (h ? 'var(--shadow-rest-hover)' : 'var(--shadow-rest)') : (h ? '0 0 0 0.5px var(--line-strong)' : '0 0 0 0.5px var(--line)');
  return (
    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{ background: 'var(--surface)', borderRadius: 'var(--radius-lg)', padding: 16, boxShadow: shadow, transition: 'box-shadow var(--duration-base) var(--ease-out)', display: 'flex', flexDirection: 'column', gap: 8, cursor: 'default' }}>
      <span className="du-subheading">Why I reread the same three books</span>
      <span className="du-small" style={{ color: 'var(--ink-secondary)' }}>Each time I return to them I notice a different sentence.</span>
      <div style={{ display: 'flex', gap: 6, marginTop: 4 }}><Tag size="sm">Memory</Tag><Tag size="sm">Reading</Tag></div>
    </div>
  );
}
function Side({ theme, lift }) {
  return (
    <div data-theme={theme} style={{ background: 'var(--bg)', color: 'var(--ink)', padding: 24, display: 'flex', flexDirection: 'column', gap: 12 }}>
      <span className="lab">{lift ? 'Hairline + shadow (default)' : 'Hairline only (previous)'} · {theme}</span>
      <DemoCard lift={lift} />
      <div style={{ background: 'var(--surface)', borderRadius: 'var(--radius-lg)', padding: 16, boxShadow: lift ? 'var(--shadow-rest)' : '0 0 0 0.5px var(--line)' }}>
        <Stat size="sm" label="Ideas linked" value="142" delta="+31% from August" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr' }}>
    <Side theme="light" /><Side theme="light" lift />
    <Side theme="dark" /><Side theme="dark" lift />
  </div>
);
</script></body></html>
