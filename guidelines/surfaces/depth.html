<!-- @dsCard group="Surfaces" viewport="700x260" name="Depth" subtitle="Hairline plus a soft resting shadow for cards; stronger shadows only for what floats." -->
<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary);font-variant-numeric:tabular-nums}.lab{font:var(--font-label);color:var(--ink)}.two{display:grid;grid-template-rows:1fr 1fr;margin:-24px}.two>div{padding:20px 24px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.b{height:48px;border-radius:var(--radius-lg);background:var(--surface);margin-bottom:8px}</style>
</head><body data-theme="light"><div class="two"><div data-theme="light"><div class="g"><div><div class="b" style="box-shadow:var(--shadow-rest)"></div><div class="lab">shadow-rest</div><div class="cap">Cards at rest</div></div><div><div class="b" style="box-shadow:var(--ring-control)"></div><div class="lab">ring-control</div><div class="cap">Buttons, inputs</div></div><div><div class="b" style="box-shadow:var(--shadow-float)"></div><div class="lab">shadow-float</div><div class="cap">Menus, toasts</div></div><div><div class="b" style="box-shadow:var(--shadow-overlay)"></div><div class="lab">shadow-overlay</div><div class="cap">Dialogs</div></div></div></div><div data-theme="dark"><div class="g"><div><div class="b" style="box-shadow:var(--shadow-rest)"></div><div class="lab">shadow-rest</div><div class="cap">Cards at rest</div></div><div><div class="b" style="box-shadow:var(--ring-control)"></div><div class="lab">ring-control</div><div class="cap">Buttons, inputs</div></div><div><div class="b" style="box-shadow:var(--shadow-float)"></div><div class="lab">shadow-float</div><div class="cap">Menus, toasts</div></div><div><div class="b" style="box-shadow:var(--shadow-overlay)"></div><div class="lab">shadow-overlay</div><div class="cap">Dialogs</div></div></div></div></div></body></html>
