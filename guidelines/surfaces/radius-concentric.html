<!-- @dsCard group="Surfaces" viewport="700x210" name="Concentric corners" subtitle="Inner radius = outer radius − padding." -->
<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary);font-variant-numeric:tabular-nums}.lab{font:var(--font-label);color:var(--ink)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.o{background:var(--surface);box-shadow:var(--ring-hairline)}.i{height:72px;background:var(--sunk)}.x{margin-top:10px}</style>
</head><body data-theme="light"><div class="g"><div><div class="o" style="border-radius:18px;padding:8px"><div class="i" style="border-radius:10px"></div></div><div class="x lab">Card 18 − 8 = 10</div><div class="cap">Media inside a card</div></div><div><div class="o" style="border-radius:12px;padding:4px;box-shadow:var(--shadow-float)"><div class="i" style="border-radius:8px;height:32px"></div><div style="height:32px"></div><div style="height:4px"></div></div><div class="x lab">Menu 12 − 4 = 8</div><div class="cap">Items inside a menu</div></div><div><div style="border-radius:10px;padding:2px;background:var(--sunk);display:flex;gap:2px"><div style="flex:1;height:32px;border-radius:8px;background:var(--surface);box-shadow:0 0 0 0.5px var(--line-strong)"></div><div style="flex:1;height:32px"></div><div style="flex:1;height:32px"></div></div><div class="x lab">Segmented 10 − 2 = 8</div><div class="cap">Segment inside a track</div></div></div></body></html>
