<!-- @dsCard group="Surfaces" viewport="700x160" name="Radius" subtitle="Modest and hierarchical. Larger surfaces get larger corners." -->
<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--ink)}.cap{font:var(--font-caption);color:var(--ink-tertiary);font-variant-numeric:tabular-nums}.lab{font:var(--font-label);color:var(--ink)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.b{height:64px;background:var(--surface);box-shadow:0 0 0 0.5px var(--line-strong)}</style>
</head><body data-theme="light"><div class="g"><div><div class="b" style="border-radius:var(--radius-xs)"></div><div class="lab" style="margin-top:8px">radius-xs</div><div class="cap">6px</div></div><div><div class="b" style="border-radius:var(--radius-sm)"></div><div class="lab" style="margin-top:8px">radius-sm</div><div class="cap">8px</div></div><div><div class="b" style="border-radius:var(--radius-md)"></div><div class="lab" style="margin-top:8px">radius-md</div><div class="cap">10px</div></div><div><div class="b" style="border-radius:var(--radius-lg)"></div><div class="lab" style="margin-top:8px">radius-lg</div><div class="cap">12px</div></div><div><div class="b" style="border-radius:var(--radius-xl)"></div><div class="lab" style="margin-top:8px">radius-xl</div><div class="cap">18px</div></div><div><div class="b" style="border-radius:var(--radius-full)"></div><div class="lab" style="margin-top:8px">radius-full</div><div class="cap">999px · pills</div></div></div></body></html>
